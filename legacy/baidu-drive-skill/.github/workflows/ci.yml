name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (esbuild bundle)
        run: npm run build

      - name: Verify bundle runs
        run: node skill/assets/dist/pan.cjs --version

      - name: Verify bundle help renders
        run: node skill/assets/dist/pan.cjs --help

  # 单独 lint job:跑一次就行,不分平台
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
        # Week 1 alpha 阶段允许 lint 失败不挡 PR;Week 2 起改为强制
        continue-on-error: true

  # 测试在 Week 2 引入(目前 tests/ 是空骨架),先跑通 vitest 不报错
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test --if-present || echo "(no tests yet, will be added in Week 2)"
